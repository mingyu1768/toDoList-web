<!DOCTYPE html>
<head>
    <meta lang="ko">
    <title>투두리스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🙃 To-Do List</h1>

        <input type="text" id="taskInput" placeholder="할 일을 입력하세요">
        <button id="addBtn">추가</button>

        <h3>📌 해야 할 일</h1>
        <ul id="taskList"></ul>

        <h3>✅ 내가 완료한 일</h3>
        <ul id="doneList"></ul>
    </div>
    <script src="script.js"></script>
</body>
